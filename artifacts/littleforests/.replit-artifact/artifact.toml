kind = "web"
previewPath = "/"
title = "LittleForests"
description = "The imported LittleForests website and storefront, brought into an editable React app for ongoing content and design updates."
version = "1.0.0"
id = "artifacts/littleforests"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23858

[services.development]
run = "pnpm --filter @workspace/littleforests run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/littleforests", "run", "build" ]
serve = "static"
publicDir = "artifacts/littleforests/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23858"
BASE_PATH = "/"
